      type:
        - string
        - 'null'
      description: Mã số thuế (MST)
    taxpayer_address:
      type:
        - string
        - 'null'
      description: Địa chỉ người nộp tiền
    telephone, fax, hotline:
      type:
        - string
        - 'null'
      description: Điện thoại, fax, hotline
    total_amount_in_words:
      type:
        - string
        - 'null'
      description: Tổng số tiền bằng chữ
    total_amount/ grand_total:
      type:
        - string
        - 'null'
      description: Số tiền/ Tổng cộng
    Tỷ giá ngoại tệ:
      type:
        - string
        - 'null'
      description: Tỷ giá ngoại tệ (vàng tiền tệ)
    unit of measurement:
      type:
        - string
        - 'null'
      description: Đơn vị tính
    VAT:
      type:
        - string
        - 'null'
      description: Thuế suất GTGT
    VAT Amount:
      type:
        - string
        - 'null'
