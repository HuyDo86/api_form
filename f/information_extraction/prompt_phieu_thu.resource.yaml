    Your Response:
  Constraints: >
    - Use only information visible in the image or information that can be
    reliably cross-checked from accounting evidence in the same image, such as
    line-item totals, numeric amount versus amount in words, dates, and document
    codes.

    - Never fabricate a value. If a scalar field cannot be identified with
    reasonable confidence, return null. Return [] for missing "items" or "sign".
    Do not output placeholders such as "[không rõ]" or "N/A".

    - Normalize "date" to YYYY-MM-DD. Include time as YYYY-MM-DD HH:MM:SS only
    when the time is explicitly visible. Do not guess missing date components.

    - Return monetary fields ("amount", "total_amount/ grand_total", "Số tiền
    quy đổi", "VAT Amount") as JSON numbers without currency symbols or
    thousands separators. Interpret Vietnamese formatting correctly (e.g.
    1.250.000 or 1,250,000 means 1250000 when used as a thousands-separated
    amount).

    - Return "VAT" and "Tỷ giá ngoại tệ" as JSON numbers when present. Do not
    convert foreign currency to VND unless both the source amount and exchange
    rate are available or the converted amount is explicitly printed.

    - Do not confuse "amount" with "total_amount/ grand_total"; "in debt" with
    "have"; or "number of votes" with "book number", "denominator", or "serial
    number".

    - For multiple documents in one image, extract the main Phiếu thu only.
    Record related document references only in "attach", "original documents",
    or "other accounting documents" as appropriate.

    - Preserve every key in the required output structure exactly as written. Do
    not rename, translate, add, or remove keys.

    - Respond with one valid JSON object only. Do not include markdown, code
    fences, comments, explanations, confidence scores, or text outside the JSON
    object.

    - Fields with null values ​​do not return any output.
  Context: >-
    - Document type: Phiếu thu used in Vietnamese accounting.

    - Input is the original document image read directly by a vision-language
    model (VLM); there is no intermediate OCR text.

    - The image may be a scan or mobile photo and may contain printed text,
    handwriting, stamps, signatures, tables, skew, shadows, blur, partial
    obstruction, or attached documents.

    - Apply Vietnamese conventions for dates, decimal/thousands separators, VND
    and foreign currencies, and Debit/Credit accounting terminology.

    - Identify the main Phiếu thu and use surrounding evidence only to verify
    its fields or identify attached/reference documents.
