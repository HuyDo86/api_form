    - id, SDSN unit code, QHNS code
    - unit of measurement
    - items
    - Reason for collection
    - charges effective from
    - declarant_name
    - taxpayer_address
    - total_amount/ grand_total
    - total_amount_in_words
    - attach
    - other accounting documents
    - original documents
    - VAT
    - VAT Amount
    - amount
    - sign
    - Đã nhận đủ số tiền
    - Tỷ giá ngoại tệ
    - Số tiền quy đổi
