          Total prices:
            type:
              - string
              - 'null'
            description: Thành tiền
          unit price:
            type:
              - string
              - 'null'
            description: Đơn giá
        required:
          - stt
          - generic
          - quantity
          - unit price
          - Total prices
          - note
          - Items
    number of votes:
      type:
        - string
        - 'null'
