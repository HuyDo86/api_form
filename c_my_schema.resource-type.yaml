    serial number:
      type:
        - string
        - 'null'
      description: Liên số
    sign:
      type: array
      items:
        type: object
        properties:
          casher:
            type:
              - string
              - 'null'
            description: Thủy quỹ
          Chef accountant:
            type:
              - number
              - 'null'
            description: Kế toán trưởng
          director:
            type:
              - integer
              - 'null'
            description: Giám đốc, thủ trưởng đơn vị
          facility owner:
            type:
              - string
              - 'null'
            description: Chủ cơ sở
          payer:
            type:
              - string
              - 'null'
            description: Người nộp tiền, người đại diện hộ kinh doanh/ cá nhân kinh doanh
          prepared by:
            type:
              - string
              - 'null'
            description: Người lập phiếu
          recipient:
            type:
              - string
              - 'null'
            description: Người nhận tiền
        required:
          - director
          - Chef accountant
          - casher
          - prepared by
          - payer
          - resipient
          - facility owner
