name: demo
ai_config:
  providers:
    deepseek:
      models:
        - deepseek/deepseek-chat
      resource_path: f/information_extraction/deepseek
error_handler: null
git_sync:
  repositories:
    - exclude_types_override: []
      git_repo_resource_path: $res:f/information_extraction/git_repository
      group_by_folder: false
      settings:
        exclude_path: []
        extra_include_path: []
        include_path:
          - f/**
        include_type:
          - script
          - flow
          - app
          - folder
          - workspacedependencies
          - datatablemigration
          - resourcetype
          - resource
          - variable
          - secret
          - schedule
          - user
          - group
          - trigger
          - settings
          - key
      use_individual_branch: false
operator_settings:
  assets: true
  audit_logs: true
  folders: true
  groups: true
  resources: true
  runs: true
  schedules: true
  triggers: true
  variables: true
  workers: true
slack_oauth_client_id: null
slack_oauth_client_secret: null
success_handler: null
